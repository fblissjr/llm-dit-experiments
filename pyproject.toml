[project]
name = "llm-dit-experiments"
version = "0.6.1"
description = "LLM-DiT experimentation platform with pluggable backends"
authors = [
  { name = "Fred Bliss" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PyTorch with CUDA 13.0 - see [tool.uv.sources] for index config
    "torch>=2.11",
    "torchvision",
    "huggingface_hub",
    # For now, LTX-2 requires diffusers 0.37+ with LTX2Pipeline (local coderef build)
    "diffusers",
    "hf-xet",  # HF Hub fast download protocol (used transparently by huggingface_hub)
    # transformers v5 compatible (uses quantization_config instead of load_in_8bit/load_in_4bit)
    # Works with both v4.40+ and v5.0+
    "transformers>=5.3",
    "accelerate",
    "safetensors",
    "pillow",
    "numpy",
    "httpx",  # API backend support
    "uvicorn>=0.38.0",
    "fastapi>=0.123.4",
    "python-multipart>=0.0.20",
    "einops",  # Tensor reshaping for Qwen-Image models
    "torchao>=0.16.0",
    "tomli-w>=1.2.0",
    "imageio[pyav]>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "tqdm>=4.65.0",  # Progress bars in pipeline generation loops
    "orjson>=3.11.7",
    "pyright>=1.1.408",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.10.7",  # Visualization in experiment scripts
    "image-reward>=1.5",  # Image quality scoring (experiments/metrics/)
    "scikit-learn>=1.3",  # t-SNE, PCA, clustering (scripts/embeddings.py)
    "spacy>=3.8.11",  # POS tagging (experiments/ltx2/token_layer_correlation.py)
]
training = [
    "peft>=0.8.0",  # LoRA adapters
    "pandas>=2.0.0",  # CSV dataset loading
    "tensorboard>=2.15.0",  # Optional logging
]
# Attention backends (require source builds, see scripts/ for install helpers)
# sageattention: Best for RTX 4090 (SM80+), supports INT8/FP16 quantized attention
#   Install: ./scripts/install_sageattention.sh
# flash-attn: Standard fast attention for Ampere/Hopper
#   Install: pip install flash-attn --no-build-isolation
# Note: vllm and sglang require CUDA, will be added back when needed
# vllm = ["vllm"]
# sglang = ["sglang"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_dit"]

[tool.hatch.metadata]
allow-direct-references = true

# Optional source builds configured above in optional-dependencies comments

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Local diffusers build with LTX2Pipeline (not in PyPI 0.36.x yet)
diffusers = { path = "./coderef/diffusers", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line too long handled by formatter

# Note: pytest config is in pytest.ini (takes precedence over pyproject.toml)

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff",
    "pyright",  # LSP
]
