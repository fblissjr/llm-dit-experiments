# LTX-2 smoke test overlay -- merged over config.toml.example
# Minimal video generation: 256x384, 9 frames, 4 steps
# Uses distilled model with model-level offloading

default_pipeline = "none"

[ltx2]
height = 384
width = 256
num_frames = 9
num_inference_steps = 4
guidance_scale = 3.0
offload_mode = "model"
use_distilled = true
distilled_steps_stage1 = 4
distilled_steps_stage2 = 2

[server]
host = "127.0.0.1"
port = 7860
