# LTX-2 standard test overlay -- merged over config.toml.example
# Higher quality video generation: 512x768, 33 frames, 12 steps
# Uses distilled model with model-level offloading
# Resolution matches official reference: landscape (512h x 768w)

default_pipeline = "none"

[ltx2]
height = 512
width = 768
num_frames = 33
num_inference_steps = 12
guidance_scale = 3.0
offload_mode = "model"
use_distilled = true
distilled_steps_stage1 = 8
distilled_steps_stage2 = 4

[server]
host = "127.0.0.1"
port = 7860
