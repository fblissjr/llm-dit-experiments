# LTX-2 GGUF smoke test overlay -- merged over config.toml.example
# Uses GGUF quantized transformer for V2 (22B) model
# Model paths extracted from config.toml by config_factory.py

default_pipeline = "none"

[ltx2]
height = 256
width = 384
num_frames = 9
guidance_scale = 1.0
use_two_stage = false
stage1_num_inference_steps = 4
use_distilled_sigmas = true

[server]
host = "127.0.0.1"
port = 7860
